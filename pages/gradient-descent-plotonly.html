                <h1>Gradient Descent</h1>
                <!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
    }

    #controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #f9f9f9;
      margin-bottom: 12px;
    }

    #sliders {
      display: grid;
      grid-template-columns: 140px 1fr 64px auto;
      align-items: center;
      gap: 6px 10px;
    }

    .adaptive-label {
      font-size: 0.85em;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    #sliders input[type="range"] { width: 100%; }

    #inputs-row {
      display: flex;
      align-items: flex-end;
      gap: 14px;
    }

    .start-input {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .start-input label { font-size: 0.85em; }

    .start-input input[type="number"] {
      width: 72px;
    }

    #inputs-row select {
      flex: 1;
      align-self: flex-end;
    }

    .showline-wrap {
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      padding-bottom: 2px;
    }

    #armijocb:disabled + label { opacity: 0.4; cursor: not-allowed; }

    #buttons-row {
      display: flex;
      gap: 10px;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 4px;
      flex: 1;
    }

    .btn-group button { width: 100%; }

    .steps {
      font-size: 0.8em;
      color: #666;
      min-height: 1.1em;
      text-align: center;
    }

    #util-buttons { margin-bottom: 8px; }
  </style>
</head>
<body>

<div id="controls">

  <div id="sliders">
    <label title="Step size taken by descent method. Initial step size for adaptive methods." for="etaslider">\(\eta\) (step size)</label>
    <input title="Slide to change the step size (or initial step size for adaptive methods)." type="range" id="etaslider" min="-5" max="-0.7" step="0.1" value="-1.3">
    <span id="etasliderValue"> </span>
    <label class="adaptive-label"><input type="checkbox" id="adaptivecb"> adaptive</label>

    <label title="Coefficient of the momentum term in the descent algorithm. Higher increases momentum so may speed up convergence, but risks overshooting." for="betaslider">\(\beta\) (momentum)</label>
    <input title="Slide to change the amount of momentum in the momentum and accelerated momentum methods."
    type="range" id="betaslider" min="0" max="0.99" step="0.01" value="0">
    <span id="betasliderValue"> </span>
    <label class="adaptive-label"><input title="Use Nesterov optimised beta value, beta = n/n+3." type="checkbox" id="nesterovbetacb"> nesterov</label>

    <label title="The difference between two adjacent steps must be less than epsilon convergence. Increase to speed up." for="tolslider">\(\epsilon\) (tolerance)</label>
    <input title="Slide to change the criterion for convergence."
    type="range" id="tolslider" min="-9" max="-2" step="1" value="-6">
    <span id="tolsliderValue"> </span>
    <span></span>
  </div>

  <div id="inputs-row">
    <div class="start-input">
      <label for="x0input">Start \(x_0\)</label>
      <input title = "Initial value of x0." type="number" id="x0input" value="-1" step="0.1">
    </div>
    <div class="start-input">
      <label for="y0input">Start \(y_0\) <small>(2D)</small></label>
      <input title="Initial value of y0." type="number" id="y0input" value="1.5" step="0.1">
    </div>
    <select title="Select the desired objective function." id="funcselect">
      <option value="quad">Quadratic</option>
      <option value="quar" selected>Quartic</option>
      <option value="ros">Rosenbrock</option>
    </select>
    <div class="showline-wrap">
      <input title="Show lines connecting adjacent steps." type="checkbox" id="showline">
      <label for="showline">Show path</label>
    </div>
    <div class="showline-wrap">
      <input title="Implement a backtracking line search after each step, that prevents any step going uphill (forces the step to cause a nonzero decrease in the function)." type="checkbox" id="backtrackcb">
      <label for="backtrackcb">Backtrack</label>
    </div>
    <div class="showline-wrap">
      <input title="Implement the Armijo condition on the backtracking, that forces a minimum decrease in the function for each step (rather than simply a nonzero decrease)." type="checkbox" id="armijocb" disabled>
      <label for="armijocb">Armijo</label>
    </div>
  </div>

  <div id="buttons-row">
    <div class="btn-group">
      <button title="Run a basic gradient descent." type="button" id="runbutton">Basic Gradient Descent</button>
      <span class="steps" id="gdsteps"></span>
    </div>
    <div class="btn-group">
      <button title="Run gradient descent with momentum from previous step." type="button" id="runmomentumbutton">Momentum Descent</button>
      <span class="steps" id="momentumsteps"></span>
    </div>
    <div class="btn-group">
      <button title="Run gradient descent with accelerated momentum, where gradient is evaluated after the momentum step." type="button" id="runacceleratedbutton">Accelerated Momentum Descent</button>
      <span class="steps" id="acceleratedsteps"></span>
    </div>
  </div>

</div>

<div id="util-buttons">
  <button title="Clear any plotted traces." type="button" id="clearbutton">Clear</button>
  <button title="Reset axis zoom to defaults." type="button" id="resetbutton">Reset Zoom</button>
</div>

<div id="chart"></div>

<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist@2/plotly.min.js"></script>
<script type="module" src="../scripts/gradient_descent.js"></script>

</body>
</html>
